<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Content-Security-Policy — lock the surface to exactly what the app needs.
       Fully first-party now: vendored React, vendored IBM Plex fonts, own styles.
       No CDN of any kind. Images allow https + data: (modpack art, base64 thumbnails).
       Everything else is denied: no iframes, plugins, workers, form posts, <base> hijack,
       or cross-origin connections (data exfiltration). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'" />

  <title>Kelvin — Minecraft launcher</title>
  <!-- Inline SVG favicon: the Kelvin mark (angular K in a gauge frame). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='3' fill='%23161B1F' stroke='%2335B8CB' stroke-width='1.6'/%3E%3Cpath d='M8 6v12M8 12l7-6M8 12l7 6' fill='none' stroke='%2335B8CB' stroke-width='2.2' stroke-linecap='square'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="src/styles.css" />

  <!-- In-page startup splash (paints immediately, before the app scripts load). Removed
       by store.js once the initial data has loaded — same surface as the app, so
       there's no black gap between the splash and the rendered launcher. -->
  <style>
    html, body { margin: 0; background: #101315; }
    #cryo-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #101315;
      transition: opacity .4s ease; opacity: 1;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #cryo-splash.cryo-hide { opacity: 0; pointer-events: none; }
    #cryo-splash .cs-flake { width: 72px; height: 72px; }
    #cryo-splash .cs-name { margin-top: 18px; font-size: 24px; font-weight: 600; color: #E4EAEC; letter-spacing: .16em; }
    #cryo-splash .cs-sub  { margin-top: 6px; font-size: 11px; color: #5C6B72; letter-spacing: .14em; text-transform: uppercase; font-family: Consolas, monospace; }
    /* GPU-composited spinner — stays smooth even while the main thread is busy. */
    #cryo-splash .cs-spin {
      margin-top: 24px; width: 26px; height: 26px;
      border: 2px solid #262E34; border-top-color: #35B8CB; border-radius: 50%;
      animation: cs-rot .8s linear infinite; will-change: transform;
    }
    @keyframes cs-rot { to { transform: rotate(360deg); } }
  </style>

  <!-- React 18.3.1 (production), vendored locally — no CDN at startup (faster, works
       offline, and keeps script-src to 'self'). UMD globals: window.React / ReactDOM.
       `defer` so neither blocks the splash's first paint; defer preserves order, so
       these still run before the app scripts below. -->
  <script defer src="vendor/react.production.min.js"></script>
  <script defer src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="cryo-splash">
    <svg class="cs-flake" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="20" rx="3" fill="#161B1F" stroke="#35B8CB" stroke-width="1.4" />
      <path d="M8 6v12M8 12l7-6M8 12l7 6" fill="none" stroke="#35B8CB" stroke-width="2" stroke-linecap="square" />
    </svg>
    <div class="cs-name">KELVIN</div>
    <div class="cs-sub">cold start in progress</div>
    <div class="cs-spin"></div>
  </div>
  <div id="root"></div>

  <!-- App scripts — plain JS (no JSX; everything is React.createElement). `defer` keeps
       execution in document order while letting the WebView download them in parallel. -->
  <script defer src="src/mockData.js"></script>
  <script defer src="src/i18n.js"></script>
  <script defer src="src/store.js"></script>
  <script defer src="src/ui.js"></script>
  <script defer src="src/charts.js"></script>
  <script defer src="src/instance-overview.js"></script>
  <script defer src="src/instance-tabs.js"></script>
  <script defer src="src/library.js"></script>
  <script defer src="src/instance.js"></script>
  <script defer src="src/logs.js"></script>
  <script defer src="src/dashboard.js"></script>
  <script defer src="src/assistant.js"></script>
  <script defer src="src/modrinth.js"></script>
  <script defer src="src/settings.js"></script>
  <script defer src="src/app.js"></script>
</body>
</html>
